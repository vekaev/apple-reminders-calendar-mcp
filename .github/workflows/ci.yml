name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test
      - name: Smoke test (MCP handshake)
        run: |
          BIN="$(swift build -c release --show-bin-path)/apple-reminders-calendar-mcp"
          printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' | "$BIN" | tee out.txt
          grep -q plan_changes out.txt
